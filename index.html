<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestión Estudiantil</title>

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header>
  <h1>Sistema de Gestión Estudiantil</h1>
</header>

<nav>
  <ul>
    <li><a href="#">Inicio</a></li>
    <li><a href="#">Estudiantes</a></li>
    <li><a href="#">Contacto</a></li>
  </ul>
</nav>

<main>

  <section>
    <article>

      <h2>Registro de Estudiantes</h2>

      <form id="studentForm">

        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" required>

        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" required>

        <label for="edad">Edad</label>
        <input type="number" id="edad" min="18" max="60">

        <label for="fecha">Fecha de Nacimiento</label>
        <input type="date" id="fecha">

        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono">

        <label for="nivel">Nivel Académico</label>
        <input type="range" id="nivel" min="1" max="10">

        <label for="archivo">Subir Archivo</label>
        <input type="file" id="archivo">

        <label>
          <input type="checkbox" required>
          Acepto los términos y condiciones
        </label>

        <button type="submit">
          Guardar Estudiante
        </button>

      </form>

    </article>
  </section>

  <section>

    <h2>Usuarios obtenidos desde API</h2>

    <div id="usuarios">
      <!-- Aquí JavaScript agregará las tarjetas -->
    </div>

  </section>

  <aside>

    <h3>Información</h3>

    <p>
      Aplicación desarrollada con HTML5, CSS3 y JavaScript ES6+.
    </p>

    <p>
      Consume una API pública mediante Fetch API.
    </p>

  </aside>

</main>

<footer>
  <p>UTEQ - Aplicaciones Web 2026</p>
</footer>

<script type="module" src="js/app.js"></script>

</body>
</html>
